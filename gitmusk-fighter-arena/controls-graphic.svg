<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" width="1200" height="580">
  <defs>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#000000" stroke-width="0.4" opacity="0.05"/>
    </pattern>
    <filter id="glow-s" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background: clean white -->
  <rect width="1200" height="580" fill="#ffffff"/>
  <rect width="1200" height="580" fill="url(#grid)"/>

  <!-- Top color bar -->
  <rect x="0" y="0" width="1200" height="6" fill="#111"/>

  <!-- Corner accents -->
  <line x1="0" y1="6" x2="80" y2="6" stroke="#0099cc" stroke-width="3"/>
  <line x1="0" y1="6" x2="0" y2="86" stroke="#0099cc" stroke-width="3"/>
  <line x1="1120" y1="6" x2="1200" y2="6" stroke="#8800cc" stroke-width="3"/>
  <line x1="1200" y1="6" x2="1200" y2="86" stroke="#8800cc" stroke-width="3"/>
  <line x1="0" y1="494" x2="0" y2="574" stroke="#0099cc" stroke-width="3"/>
  <line x1="0" y1="574" x2="80" y2="574" stroke="#0099cc" stroke-width="3"/>
  <line x1="1200" y1="494" x2="1200" y2="574" stroke="#8800cc" stroke-width="3"/>
  <line x1="1120" y1="574" x2="1200" y2="574" stroke="#8800cc" stroke-width="3"/>

  <!-- Bottom bar -->
  <rect x="0" y="574" width="1200" height="6" fill="#111"/>

  <!-- Header -->
  <text x="600" y="52" text-anchor="middle" fill="#aaaaaa" font-family="'Courier New', monospace" font-size="11" letter-spacing="6">// EXARENA.XYZ</text>
  <text x="600" y="96" text-anchor="middle" fill="#111111" font-family="'Courier New', monospace" font-size="33" font-weight="bold" letter-spacing="10">KEYBOARD CONTROLS</text>

  <!-- Header underline -->
  <line x1="180" y1="112" x2="545" y2="112" stroke="#dddddd" stroke-width="1.5"/>
  <circle cx="600" cy="112" r="3" fill="#cccccc"/>
  <line x1="655" y1="112" x2="1020" y2="112" stroke="#dddddd" stroke-width="1.5"/>

  <!-- Center dashed divider -->
  <line x1="600" y1="128" x2="600" y2="530" stroke="#e0e0e0" stroke-width="2" stroke-dasharray="8,5"/>

  <!-- ── LEFT PANEL: MOVEMENT ── -->
  <text x="300" y="150" text-anchor="middle" fill="#0099cc" font-family="'Courier New', monospace" font-size="12" letter-spacing="7">MOVEMENT</text>

  <!-- UP key -->
  <rect x="262" y="173" width="76" height="76" rx="12" fill="#f0f8ff" stroke="#0099cc" stroke-width="2.5"/>
  <rect x="266" y="177" width="68" height="32" rx="7" fill="#ddf0ff" opacity="0.9"/>
  <text x="300" y="220" text-anchor="middle" fill="#0099cc" font-family="monospace" font-size="28" font-weight="bold">↑</text>
  <text x="300" y="266" text-anchor="middle" fill="#0099cc" font-family="monospace" font-size="10" letter-spacing="3">JUMP</text>

  <!-- LEFT key -->
  <rect x="178" y="256" width="76" height="76" rx="12" fill="#f0f8ff" stroke="#0099cc" stroke-width="2.5"/>
  <rect x="182" y="260" width="68" height="32" rx="7" fill="#ddf0ff" opacity="0.9"/>
  <text x="216" y="303" text-anchor="middle" fill="#0099cc" font-family="monospace" font-size="28" font-weight="bold">←</text>
  <text x="216" y="350" text-anchor="middle" fill="#0099cc" font-family="monospace" font-size="10" letter-spacing="3">LEFT</text>

  <!-- DOWN key (block) -->
  <rect x="262" y="256" width="76" height="76" rx="12" fill="#f0fff8" stroke="#009966" stroke-width="2.5"/>
  <rect x="266" y="260" width="68" height="32" rx="7" fill="#ccf5e8" opacity="0.9"/>
  <text x="300" y="303" text-anchor="middle" fill="#009966" font-family="monospace" font-size="28" font-weight="bold">↓</text>
  <text x="300" y="350" text-anchor="middle" fill="#009966" font-family="monospace" font-size="10" letter-spacing="3">BLOCK</text>

  <!-- RIGHT key -->
  <rect x="346" y="256" width="76" height="76" rx="12" fill="#f0f8ff" stroke="#0099cc" stroke-width="2.5"/>
  <rect x="350" y="260" width="68" height="32" rx="7" fill="#ddf0ff" opacity="0.9"/>
  <text x="384" y="303" text-anchor="middle" fill="#0099cc" font-family="monospace" font-size="28" font-weight="bold">→</text>
  <text x="384" y="350" text-anchor="middle" fill="#0099cc" font-family="monospace" font-size="10" letter-spacing="3">RIGHT</text>

  <!-- Movement hint -->
  <text x="300" y="412" text-anchor="middle" fill="#aaaaaa" font-family="monospace" font-size="11" letter-spacing="1">← → to move · ↑ to jump · ↓ to block</text>
  <text x="300" y="434" text-anchor="middle" fill="#cccccc" font-family="monospace" font-size="10" letter-spacing="1">fallback: W  A  S  D</text>

  <!-- ── RIGHT PANEL: ATTACK ── -->
  <text x="900" y="150" text-anchor="middle" fill="#8800cc" font-family="'Courier New', monospace" font-size="12" letter-spacing="7">ATTACK</text>

  <!-- Z = PUNCH -->
  <rect x="660" y="188" width="82" height="82" rx="12" fill="#fff5f5" stroke="#dd2222" stroke-width="2.5"/>
  <rect x="664" y="192" width="74" height="36" rx="7" fill="#ffe0e0" opacity="0.9"/>
  <text x="701" y="240" text-anchor="middle" fill="#dd2222" font-family="monospace" font-size="34" font-weight="bold">Z</text>
  <text x="701" y="292" text-anchor="middle" fill="#dd2222" font-family="monospace" font-size="11" letter-spacing="3">PUNCH</text>

  <!-- X = KICK -->
  <rect x="762" y="188" width="82" height="82" rx="12" fill="#fffaf0" stroke="#cc8800" stroke-width="2.5"/>
  <rect x="766" y="192" width="74" height="36" rx="7" fill="#ffeecc" opacity="0.9"/>
  <text x="803" y="240" text-anchor="middle" fill="#cc8800" font-family="monospace" font-size="34" font-weight="bold">X</text>
  <text x="803" y="292" text-anchor="middle" fill="#cc8800" font-family="monospace" font-size="11" letter-spacing="3">KICK</text>

  <!-- C = SPECIAL -->
  <rect x="864" y="188" width="82" height="82" rx="12" fill="#faf5ff" stroke="#8800cc" stroke-width="2.5"/>
  <rect x="868" y="192" width="74" height="36" rx="7" fill="#eeddff" opacity="0.9"/>
  <text x="905" y="240" text-anchor="middle" fill="#8800cc" font-family="monospace" font-size="34" font-weight="bold">C</text>
  <text x="905" y="287" text-anchor="middle" fill="#8800cc" font-family="monospace" font-size="10" letter-spacing="2">SPECIAL</text>
  <text x="905" y="303" text-anchor="middle" fill="#aa44dd" font-family="monospace" font-size="8" letter-spacing="1">5 HITS COMBO</text>

  <!-- V = ULTIMATE -->
  <rect x="966" y="188" width="82" height="82" rx="12" fill="#fff5f9" stroke="#cc1155" stroke-width="2.5"/>
  <rect x="970" y="192" width="74" height="36" rx="7" fill="#ffddee" opacity="0.9"/>
  <text x="1007" y="240" text-anchor="middle" fill="#cc1155" font-family="monospace" font-size="34" font-weight="bold">V</text>
  <text x="1007" y="287" text-anchor="middle" fill="#cc1155" font-family="monospace" font-size="10" letter-spacing="2">ULTIMATE</text>
  <text x="1007" y="303" text-anchor="middle" fill="#ee3377" font-family="monospace" font-size="8" letter-spacing="1">RAGE MOVE</text>

  <!-- Connector line between attack keys -->
  <line x1="664" y1="270" x2="664" y2="330" stroke="#dddddd" stroke-width="1"/>
  <line x1="664" y1="330" x2="1048" y2="330" stroke="#dddddd" stroke-width="1" stroke-dasharray="5,4"/>
  <line x1="1048" y1="270" x2="1048" y2="330" stroke="#dddddd" stroke-width="1"/>

  <!-- Attack hint -->
  <text x="864" y="412" text-anchor="middle" fill="#aaaaaa" font-family="monospace" font-size="11" letter-spacing="1">Z  X  C  V — four keys in a row</text>
  <text x="864" y="434" text-anchor="middle" fill="#cccccc" font-family="monospace" font-size="10" letter-spacing="1">fallback: F  G  H  V</text>

  <!-- Footer -->
  <line x1="100" y1="500" x2="1100" y2="500" stroke="#eeeeee" stroke-width="1.5"/>
  <text x="600" y="543" text-anchor="middle" fill="#bbbbbb" font-family="monospace" font-size="11" letter-spacing="4">EXARENA.XYZ — FIGHT YOUR WAY TO THE TOP</text>
</svg>
