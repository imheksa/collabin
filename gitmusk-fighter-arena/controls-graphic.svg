<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" width="1200" height="580">
  <defs>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#ffffff" stroke-width="0.3" opacity="0.07"/>
    </pattern>
    <filter id="glow-b" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-s" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="580" fill="#06060f"/>
  <rect width="1200" height="580" fill="url(#grid)"/>

  <!-- Corner accents -->
  <line x1="0" y1="0" x2="90" y2="0" stroke="#00ccff" stroke-width="4"/>
  <line x1="0" y1="0" x2="0" y2="90" stroke="#00ccff" stroke-width="4"/>
  <line x1="1110" y1="0" x2="1200" y2="0" stroke="#b026ff" stroke-width="4"/>
  <line x1="1200" y1="0" x2="1200" y2="90" stroke="#b026ff" stroke-width="4"/>
  <line x1="0" y1="490" x2="0" y2="580" stroke="#00ccff" stroke-width="4"/>
  <line x1="0" y1="580" x2="90" y2="580" stroke="#00ccff" stroke-width="4"/>
  <line x1="1200" y1="490" x2="1200" y2="580" stroke="#b026ff" stroke-width="4"/>
  <line x1="1110" y1="580" x2="1200" y2="580" stroke="#b026ff" stroke-width="4"/>

  <!-- Header -->
  <text x="600" y="50" text-anchor="middle" fill="#444466" font-family="'Courier New', monospace" font-size="11" letter-spacing="6">// EXARENA.XYZ</text>
  <text x="600" y="95" text-anchor="middle" fill="#ffffff" font-family="'Courier New', monospace" font-size="34" font-weight="bold" letter-spacing="10">KEYBOARD CONTROLS</text>

  <!-- Header underline decoration -->
  <line x1="180" y1="112" x2="545" y2="112" stroke="#1e1e3a" stroke-width="1.5"/>
  <circle cx="600" cy="112" r="3" fill="#444"/>
  <line x1="655" y1="112" x2="1020" y2="112" stroke="#1e1e3a" stroke-width="1.5"/>

  <!-- Center dashed divider -->
  <line x1="600" y1="130" x2="600" y2="530" stroke="#151528" stroke-width="2" stroke-dasharray="8,5"/>

  <!-- ── LEFT PANEL: MOVEMENT ── -->
  <text x="300" y="150" text-anchor="middle" fill="#00ccff" font-family="'Courier New', monospace" font-size="12" letter-spacing="7" filter="url(#glow-s)">MOVEMENT</text>

  <!-- UP key -->
  <rect x="262" y="175" width="76" height="76" rx="12" fill="#050518" stroke="#00ccff" stroke-width="2.5"/>
  <rect x="266" y="179" width="68" height="34" rx="7" fill="#0c0c2a" opacity="0.8"/>
  <text x="300" y="222" text-anchor="middle" fill="#00ccff" font-family="monospace" font-size="28" font-weight="bold" filter="url(#glow-s)">↑</text>
  <text x="300" y="270" text-anchor="middle" fill="#00ccff" font-family="monospace" font-size="10" letter-spacing="3" opacity="0.9">JUMP</text>

  <!-- LEFT key -->
  <rect x="178" y="258" width="76" height="76" rx="12" fill="#050518" stroke="#00ccff" stroke-width="2.5"/>
  <rect x="182" y="262" width="68" height="34" rx="7" fill="#0c0c2a" opacity="0.8"/>
  <text x="216" y="305" text-anchor="middle" fill="#00ccff" font-family="monospace" font-size="28" font-weight="bold" filter="url(#glow-s)">←</text>
  <text x="216" y="353" text-anchor="middle" fill="#00ccff" font-family="monospace" font-size="10" letter-spacing="3" opacity="0.9">LEFT</text>

  <!-- DOWN key (block color teal) -->
  <rect x="262" y="258" width="76" height="76" rx="12" fill="#021210" stroke="#00aa88" stroke-width="2.5"/>
  <rect x="266" y="262" width="68" height="34" rx="7" fill="#031a14" opacity="0.8"/>
  <text x="300" y="305" text-anchor="middle" fill="#00cc99" font-family="monospace" font-size="28" font-weight="bold">↓</text>
  <text x="300" y="353" text-anchor="middle" fill="#00aa88" font-family="monospace" font-size="10" letter-spacing="3" opacity="0.9">BLOCK</text>

  <!-- RIGHT key -->
  <rect x="346" y="258" width="76" height="76" rx="12" fill="#050518" stroke="#00ccff" stroke-width="2.5"/>
  <rect x="350" y="262" width="68" height="34" rx="7" fill="#0c0c2a" opacity="0.8"/>
  <text x="384" y="305" text-anchor="middle" fill="#00ccff" font-family="monospace" font-size="28" font-weight="bold" filter="url(#glow-s)">→</text>
  <text x="384" y="353" text-anchor="middle" fill="#00ccff" font-family="monospace" font-size="10" letter-spacing="3" opacity="0.9">RIGHT</text>

  <!-- Movement summary text -->
  <text x="300" y="415" text-anchor="middle" fill="#2a2a4a" font-family="monospace" font-size="11" letter-spacing="1">← → to move · ↑ to jump · ↓ to block</text>
  <text x="300" y="440" text-anchor="middle" fill="#1e1e32" font-family="monospace" font-size="10" letter-spacing="1">fallback: W A S D</text>

  <!-- ── RIGHT PANEL: ATTACK ── -->
  <text x="900" y="150" text-anchor="middle" fill="#b026ff" font-family="'Courier New', monospace" font-size="12" letter-spacing="7" filter="url(#glow-s)">ATTACK</text>

  <!-- Z = PUNCH -->
  <rect x="660" y="190" width="80" height="80" rx="12" fill="#180505" stroke="#ff4444" stroke-width="2.5"/>
  <rect x="664" y="194" width="72" height="36" rx="7" fill="#200808" opacity="0.8"/>
  <text x="700" y="242" text-anchor="middle" fill="#ff4444" font-family="monospace" font-size="34" font-weight="bold">Z</text>
  <text x="700" y="295" text-anchor="middle" fill="#ff6666" font-family="monospace" font-size="11" letter-spacing="3">PUNCH</text>

  <!-- X = KICK -->
  <rect x="760" y="190" width="80" height="80" rx="12" fill="#141000" stroke="#ffaa00" stroke-width="2.5"/>
  <rect x="764" y="194" width="72" height="36" rx="7" fill="#1c1500" opacity="0.8"/>
  <text x="800" y="242" text-anchor="middle" fill="#ffaa00" font-family="monospace" font-size="34" font-weight="bold">X</text>
  <text x="800" y="295" text-anchor="middle" fill="#ffcc44" font-family="monospace" font-size="11" letter-spacing="3">KICK</text>

  <!-- C = SPECIAL -->
  <rect x="860" y="190" width="80" height="80" rx="12" fill="#0e0018" stroke="#b026ff" stroke-width="2.5"/>
  <rect x="864" y="194" width="72" height="36" rx="7" fill="#130020" opacity="0.8"/>
  <text x="900" y="242" text-anchor="middle" fill="#b026ff" font-family="monospace" font-size="34" font-weight="bold" filter="url(#glow-s)">C</text>
  <text x="900" y="290" text-anchor="middle" fill="#cc44ff" font-family="monospace" font-size="10" letter-spacing="2">SPECIAL</text>
  <text x="900" y="306" text-anchor="middle" fill="#7718aa" font-family="monospace" font-size="8" letter-spacing="1">5 HITS COMBO</text>

  <!-- V = ULTIMATE -->
  <rect x="960" y="190" width="80" height="80" rx="12" fill="#18000e" stroke="#ff2d75" stroke-width="2.5"/>
  <rect x="964" y="194" width="72" height="36" rx="7" fill="#200012" opacity="0.8"/>
  <text x="1000" y="242" text-anchor="middle" fill="#ff2d75" font-family="monospace" font-size="34" font-weight="bold" filter="url(#glow-s)">V</text>
  <text x="1000" y="290" text-anchor="middle" fill="#ff5599" font-family="monospace" font-size="10" letter-spacing="2">ULTIMATE</text>
  <text x="1000" y="306" text-anchor="middle" fill="#aa1144" font-family="monospace" font-size="8" letter-spacing="1">RAGE MOVE</text>

  <!-- Attack connector bar -->
  <line x1="664" y1="272" x2="658" y2="330" stroke="#ff444440" stroke-width="1"/>
  <line x1="658" y1="330" x2="1042" y2="330" stroke="#44444440" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="1042" y1="272" x2="1042" y2="330" stroke="#ff2d7540" stroke-width="1"/>

  <!-- Attack fallback -->
  <text x="860" y="415" text-anchor="middle" fill="#2a2a4a" font-family="monospace" font-size="11" letter-spacing="1">Z  X  C  V in a row on your keyboard</text>
  <text x="860" y="440" text-anchor="middle" fill="#1e1e32" font-family="monospace" font-size="10" letter-spacing="1">fallback: F  G  H  V</text>

  <!-- Footer -->
  <text x="600" y="510" text-anchor="middle" fill="#1e1e32" font-family="monospace" font-size="10" letter-spacing="4">────────────────────────────────────────</text>
  <text x="600" y="548" text-anchor="middle" fill="#2a2a4a" font-family="monospace" font-size="11" letter-spacing="3">EXARENA.XYZ — FIGHT YOUR WAY TO THE TOP</text>
</svg>
